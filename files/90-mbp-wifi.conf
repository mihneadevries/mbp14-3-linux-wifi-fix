# mbp14-3-linux-wifi-fix
# brcmfmac (BCM43602) fails the scan that NetworkManager runs right after it
# switches the card to a random MAC (wpa_supplicant: CTRL-EVENT-SCAN-FAILED
# ret=-22). The retry comes back without the 5 GHz networks, so joining them
# fails with "network could not be found". Keep the real MAC while scanning.
# Per-connection MAC randomization (wifi.cloned-mac-address) is not affected.
[device-mbp-wifi-brcmfmac]
match-device=driver:brcmfmac
wifi.scan-rand-mac-address=no
